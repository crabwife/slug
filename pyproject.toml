[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "report-wizard"
version = "0.1.1"
description = "Interactive terminal setup for CSV-backed LaTeX macros"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
report-wizard = "report_wizard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
